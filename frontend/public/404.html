<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="robots" content="noindex" />
    <title>Not found - CodeArmor</title>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <!-- Served by the host for any path the build does not produce, so it
         cannot import the app stylesheet or the React bundle - none of that
         exists at this URL. The token values are therefore repeated literally
         here, and this file is the one place in the frontend allowed to do
         that. -->
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0b0c;
        color: #ededee;
        font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
        max-width: 460px;
        padding: 48px 24px;
        border: 1px solid #24242a;
        border-radius: 2px;
        background: #101012;
        text-align: center;
      }
      .mark,
      .mark img {
        display: block;
        width: 44px;
        height: 44px;
      }
      .code {
        padding: 2px 8px;
        border: 1px solid #24242a;
        border-radius: 999px;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: #5c5c65;
      }
      h1 {
        margin: 0;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 44ch;
        font-size: 13px;
        line-height: 1.6;
        color: #83838c;
      }
      /* The path is set from script with textContent, never innerHTML - it is
         attacker-controlled by definition, since anyone can pick the URL. */
      #path {
        display: block;
        margin-top: 2px;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 12px;
        color: #b4b4b9;
        overflow-wrap: anywhere;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        padding: 0 12px;
        height: 28px;
        border: 1px solid #34343d;
        border-radius: 2px;
        background: #ffab2e;
        color: #0b0b0c;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
      }
      a.btn:hover {
        filter: brightness(1.08);
      }
      a.btn:focus-visible {
        outline: 2px solid #ffab2e;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">
        <img src="/logo.png" width="44" height="44" alt="" />
      </span>

      <span class="code">404</span>
      <h1>No page at this address</h1>
      <p>
        CodeArmor is a single console: repositories, pull requests and reviews all
        live on one page. There is nothing else to route to.
        <span id="path"></span>
      </p>

      <a class="btn" href="/">Go to the console</a>
    </main>

    <script>
      var el = document.getElementById('path')
      if (el) el.textContent = location.pathname
    </script>
  </body>
</html>
