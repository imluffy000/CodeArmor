# Render Blueprint for CodeArmor: API, static frontend and Postgres.
#
# Everything about the deployment lives here rather than in the dashboard, so
# it is reviewable, reproducible and revertible. Apply with:
#   Render Dashboard -> New -> Blueprint -> point at this repo.
#
# The live services were provisioned through the Render API, which does not
# accept a rootDir, so their build and start commands are path-prefixed from
# the repository root. This file is the equivalent declarative form.

envVarGroups:
  # Shared so that any future worker derives the SAME generated secrets. A
  # per-service generateValue produces a different value per service, and a
  # worker with a different TOKEN_ENCRYPTION_KEY cannot decrypt the tokens the
  # web service wrote.
  - name: codearmor-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SESSION_SECRET
        generateValue: true
      # Generate locally and paste once:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # BACKEND_URL must match the GitHub OAuth App callback exactly, or the
      # sign-in fails with redirect_uri_mismatch.
      - key: FRONTEND_URL
        value: https://codearmor-web-kxwt.onrender.com
      - key: BACKEND_URL
        value: https://codearmor-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://codearmor-web-kxwt.onrender.com
      # The frontend and the API are on different onrender.com subdomains, so
      # the session cookie is cross-site: browsers only send it when
      # SameSite=None AND Secure are both set.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: LOG_FORMAT
        value: json

services:
  - type: web
    name: codearmor-api
    runtime: python
    # The free plan sleeps after 15 minutes and cold-starts in 30-90s, which a
    # multi-minute streaming review does not survive gracefully. Upgrade to
    # starter for anything past a demo.
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Must bind 0.0.0.0:$PORT: Render port-scans the container and fails the
    # deploy with "no open ports detected" for a 127.0.0.1 bind.
    # proxy-headers makes request.url https behind the Render router.
    startCommand: >-
      uvicorn app.main:app
      --host 0.0.0.0 --port $PORT
      --workers 1
      --timeout-keep-alive 75
      --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: codearmor-shared
      - key: DATABASE_URL
        fromDatabase:
          name: codearmor-db
          property: connectionString

  - type: web
    name: codearmor-web
    runtime: static
    rootDir: frontend
    buildCommand: (npm ci || npm install) && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Inlined into the public JavaScript bundle at build time, so it must
      # never hold a secret, and changing it needs a rebuild, not a restart.
      - key: VITE_API_URL
        value: https://codearmor-api.onrender.com

databases:
  # Not SQLite. A Render filesystem is wiped on every deploy, restart and
  # instance replacement, which would take every user, connected repository,
  # stored OAuth token and saved review with it.
  - name: codearmor-db
    # The free plan expires 30 days after creation; basic-256mb is the smallest
    # plan that persists indefinitely.
    plan: free
    databaseName: codearmor
    user: codearmor
    region: singapore
